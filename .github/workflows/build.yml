name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write      # needed to attach files to a GitHub Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          APP_VERSION=$(python -c "import sys; sys.path.insert(0,'src'); from constants import VERSION; print(VERSION)")
          if [ "v$APP_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match src/constants.py VERSION v$APP_VERSION"; exit 1
          fi

      - name: Build executable
        run: python build.py

      - uses: actions/upload-artifact@v4
        with:
          name: FloppyMounter-win64
          path: |
            dist/FloppyMounter.exe
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/FloppyMounter.exe
            dist/*.zip
            dist/SHA256SUMS.txt
